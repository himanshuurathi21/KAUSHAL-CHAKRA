name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm test

  smoke:
    name: Smoke test (API + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaushalchakra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaushalchakra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaushalchakra?schema=public
      - run: node scripts/seed.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaushalchakra?schema=public
          JWT_SECRET: ci-smoke-test-secret-at-least-32-chars-long
      - run: node src/index.js &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaushalchakra?schema=public
          JWT_SECRET: ci-smoke-test-secret-at-least-32-chars-long
          PORT: 4000
      - run: sleep 5 && npm run smoke
        env:
          API_URL: http://localhost:4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaushalchakra?schema=public
          JWT_SECRET: ci-smoke-test-secret-at-least-32-chars-long

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build