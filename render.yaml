# Render blueprint - free-tier deployment
# One web service builds BOTH backend and frontend; Express serves frontend/dist.
# Neon (hosted Postgres) is now used instead of Render free Postgres (which expires after 30 days).
# For Neon: set DATABASE_URL manually in Render dashboard -> Environment -> add your Neon pooled URL
# (e.g. postgresql://neondb_owner:npg_xxx@ep-xxx.neon.tech/neondb?sslmode=require)
# If you prefer Render DB, keep the fromDatabase below; otherwise replace with a plain value.
services:
  - type: web
    name: kaushalchakra-app
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && cd ../frontend && npm ci && npm run build && cd ../backend
    startCommand: npx prisma migrate deploy && node scripts/seed.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # For Neon: change to `value: postgresql://...` or set in dashboard; keep fromDatabase for Render DB
        fromDatabase:
          name: kaushalchakra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: kaushalchakra-db
    plan: free
