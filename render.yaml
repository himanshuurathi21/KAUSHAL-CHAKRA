# Render blueprint — free-tier deployment
# Deploy: render.com pe GitHub login karo -> "New" -> "Blueprint" -> yeh repo
# One web service builds BOTH the backend and the frontend; Express serves
# the built React app itself (see backend/src/index.js). Only 2 resources —
# both supported by the Render blueprint spec.
services:
  - type: web
    name: kaushalchakra-app
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && cd ../frontend && npm ci && npm run build && cd ../backend
    startCommand: npx prisma migrate deploy && node scripts/seed.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaushalchakra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: kaushalchakra-db
    plan: free