# Render blueprint — free-tier deployment
# Deploy: render.com pe GitHub login karo -> "New" -> "Blueprint" -> yeh repo
# Everything (PostgreSQL + API + web UI) gets created automatically.
services:
  - type: web
    name: kaushalchakra-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node scripts/seed.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaushalchakra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000

  - type: web
    name: kaushalchakra-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kaushalchakra-api.onrender.com/api/*

databases:
  - name: kaushalchakra-db
    plan: free